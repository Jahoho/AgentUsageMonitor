name: Feature request
description: Propose a focused improvement or a provider with a reliable data source.
title: "[Feature]: "
body:
  - type: textarea
    id: scenario
    attributes:
      label: Usage scenario
      description: When does this matter, what are you trying to decide, and what do you do today instead?
      placeholder: When I am about to start a long coding session, I need to...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unreliable, slow, confusing, or impossible in that workflow?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful behavior, not only a preferred implementation.
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What would you be able to understand or do when the improvement works?

  - type: textarea
    id: source
    attributes:
      label: Data source and confidence
      description: For provider requests, link the official API or CLI documentation and state whether the value would be Official, Observed, Estimated, or Unavailable.

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Note any new credentials, files, network destinations, local listeners, or stored fields.

  - type: textarea
    id: alternatives
    attributes:
      label: Tradeoffs and alternatives
      description: What simpler workaround exists, and what should this feature deliberately avoid doing?
